<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>航空券セール速報</title>
<meta name="description" content="Peach・ジェットスター・スカイマーク・JAL・ANA などの航空券セール情報を自動で集めて一覧にするページ。自分が使う都市を登録すると、関係するセールが上に出ます。">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#5f6b7a; --line:#e3e6ea; --accent:#0b6bcb; --accent-bg:#e7f1fd; --new:#d9480f; --new-bg:#fff0e6; --chip:#eef1f5; --chip-on:#0b6bcb; --chip-on-text:#fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa4b2; --line:#2a2f38; --accent:#6cb4ff; --accent-bg:#17283d; --new:#ff8a4c; --new-bg:#3a2316; --chip:#242933; --chip-on:#6cb4ff; --chip-on-text:#0f1115; } }
  :root[data-theme="dark"] { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa4b2; --line:#2a2f38; --accent:#6cb4ff; --accent-bg:#17283d; --new:#ff8a4c; --new-bg:#3a2316; --chip:#242933; --chip-on:#6cb4ff; --chip-on-text:#0f1115; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; line-height:1.55; }
  .wrap { max-width:860px; margin:0 auto; padding:16px; }
  header h1 { font-size:22px; margin:0 0 4px; }
  header p { margin:0; color:var(--muted); font-size:13px; }
  section { margin-top:20px; }
  h2 { font-size:16px; margin:0 0 8px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:0; border-radius:999px; padding:6px 12px; background:var(--chip); color:var(--text); font-size:14px; cursor:pointer; }
  .chip.on { background:var(--chip-on); color:var(--chip-on-text); }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .card.hit { border-color:var(--accent); }
  .badges { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; align-items:center; }
  .badge { font-size:12px; padding:2px 8px; border-radius:6px; background:var(--accent-bg); color:var(--accent); font-weight:600; }
  .badge.new { background:var(--new-bg); color:var(--new); }
  .badge.src { background:var(--chip); color:var(--muted); font-weight:400; }
  .title { font-size:16px; font-weight:700; margin:0; }
  .title a { color:var(--text); text-decoration:none; }
  .title a:hover { text-decoration:underline; }
  .meta { color:var(--muted); font-size:13px; margin-top:6px; }
  .meta div { margin-top:2px; }
  .routes span { display:inline-block; background:var(--chip); border-radius:6px; padding:1px 7px; margin:2px 4px 0 0; font-size:12px; }
  .empty { color:var(--muted); font-size:14px; padding:10px 0; }
  footer { color:var(--muted); font-size:12px; margin:28px 0 8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  select, input[type=search] { font-size:14px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✈ 航空券セール速報</h1>
    <p>ニュースサイトと航空会社の公式ページから、セール記事を自動で集めています。2時間おきに更新。最終更新: <span id="updated">読込中…</span></p>
  </header>

  <section>
    <h2>自分が使う都市を登録</h2>
    <div class="panel">
      <div class="chips" id="cities"></div>
      <div class="hint">押した都市が発着に入るセールが「あなた向け」に出ます。登録はこのブラウザだけに保存され、他の人には見えません。</div>
      <div class="row" style="margin-top:10px">
        <label>航空会社: <select id="airline"><option value="">すべて</option></select></label>
        <input type="search" id="q" placeholder="キーワード（例: 札幌）">
      </div>
    </div>
  </section>

  <section>
    <h2>あなた向け <span id="hitCount" class="badge"></span></h2>
    <div id="hits"></div>
  </section>

  <section>
    <h2>すべてのセール記事 <span id="allCount" class="badge"></span></h2>
    <div id="all"></div>
  </section>

  <footer>
    出典: TRAICY・sky-budget・トラベルWatch・Aviation Wire の記事、スカイマーク公式。価格・期間は記事から機械的に抜いたもので、必ずリンク先の原文で確かめてください。記事は180日で消えます。
  </footer>
</div>
<script>
(async function () {
  const CITY_LIST = ['東京','札幌','大阪','神戸','名古屋','福岡','沖縄','仙台','函館','旭川','釧路','女満別','石垣','宮古','長崎','熊本','鹿児島','宮崎','新潟','広島','高松','松山','ソウル','台北','香港','上海','バンコク','シンガポール'];
  const LS = 'sale-watch.cities';
  let mine = [];
  try { mine = JSON.parse(localStorage.getItem(LS) || '[]'); } catch (e) { mine = []; }
  const $ = s => document.querySelector(s);
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const cityBox = $('#cities');
  for (const c of CITY_LIST) {
    const b = document.createElement('button'); b.className = 'chip' + (mine.includes(c) ? ' on' : ''); b.textContent = c; b.type = 'button';
    b.onclick = () => { mine = mine.includes(c) ? mine.filter(x => x !== c) : [...mine, c]; try { localStorage.setItem(LS, JSON.stringify(mine)); } catch (e) { } b.classList.toggle('on'); render(); };
    cityBox.appendChild(b);
  }
  let data = { items: [] };
  try { const r = await fetch('data/sales.json?t=' + Date.now()); data = await r.json(); } catch (e) { $('#updated').textContent = '読み込めませんでした'; }
  if (data.updatedAt) $('#updated').textContent = new Date(data.updatedAt).toLocaleString('ja-JP');
  const airlines = [...new Set(data.items.flatMap(i => i.airlines))].sort();
  for (const a of airlines) { const o = document.createElement('option'); o.value = a; o.textContent = a; $('#airline').appendChild(o); }
  $('#airline').onchange = render; $('#q').oninput = render;

  function matches(item) {
    if (!mine.length) return false;
    const inRoutes = item.routes.some(r => r.split('⇄').some(c => mine.includes(c)));
    const inCities = !item.routes.length && item.cities.some(c => mine.includes(c));
    return inRoutes || inCities;
  }
  function card(i, hit) {
    const fresh = Date.now() - new Date(i.firstSeen).getTime() < 48 * 3600 * 1000;
    const d = new Date(i.published);
    return `<div class="card${hit ? ' hit' : ''}">
      <div class="badges">${fresh ? '<span class="badge new">新着</span>' : ''}${i.airlines.map(a => `<span class="badge">${esc(a)}</span>`).join('')}<span class="badge src">${esc(i.source)}</span><span class="badge src">${d.getMonth() + 1}/${d.getDate()}</span></div>
      <p class="title"><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a></p>
      <div class="meta">
        ${i.routes.length ? `<div class="routes">${i.routes.map(r => `<span>${esc(r)}</span>`).join('')}</div>` : (i.cities.length ? `<div class="routes">${i.cities.map(r => `<span>${esc(r)}</span>`).join('')}</div>` : '')}
        ${i.prices && i.prices.length ? `<div>価格の記載: ${esc(i.prices.slice(0, 5).join('、'))}</div>` : ''}
        ${i.salePeriod ? `<div>${esc(i.salePeriod)}</div>` : ''}
        ${i.boardingPeriod ? `<div>${esc(i.boardingPeriod)}</div>` : ''}
        ${!i.salePeriod && !i.boardingPeriod && i.summary ? `<div>${esc(i.summary.slice(0, 120))}…</div>` : ''}
      </div>
    </div>`;
  }
  function render() {
    const al = $('#airline').value, q = ($('#q').value || '').trim();
    const list = data.items.filter(i => (!al || i.airlines.includes(al)) && (!q || (i.title + i.summary + i.routes.join() + i.cities.join()).includes(q)));
    const hits = list.filter(matches);
    $('#hits').innerHTML = hits.length ? hits.map(i => card(i, true)).join('') : `<div class="empty">${mine.length ? '登録した都市に関係するセール記事はまだありません。' : '上で都市を登録すると、ここに関係するセールが出ます。'}</div>`;
    $('#hitCount').textContent = hits.length;
    $('#all').innerHTML = list.length ? list.map(i => card(i, false)).join('') : '<div class="empty">記事がありません。</div>';
    $('#allCount').textContent = list.length;
  }
  render();
})();
</script>
</body>
</html>
